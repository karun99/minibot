[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minibot"
version = "1.0.0"
description = "Ollama-powered terminal bot with sandboxed file read/write and optional intent pre-filter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
minibot = "minibot.cli:main"

[tool.setuptools]
packages = ["minibot"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
